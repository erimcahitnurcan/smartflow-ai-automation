# SmartFlow local stack.
# Secrets are read from the ".env" file next to this file (copy it from ".env.example").

services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      # SQLite file inside the mounted volume, so data survives container rebuilds.
      ConnectionStrings__SmartFlow: "Data Source=/app/data/smartflow.db"
      # Fails fast with a clear message if the key is missing from .env.
      SmartFlow__ApiKey: ${SMARTFLOW_API_KEY:?Set SMARTFLOW_API_KEY in the .env file}
    volumes:
      - api_data:/app/data
    restart: unless-stopped

  n8n:
    # Pinned version: "latest" could change behaviour without notice.
    image: docker.n8n.io/n8nio/n8n:2.49.6
    ports:
      - "5678:5678"
    environment:
      # Encrypts credentials (such as the SmartFlow API key) stored by n8n.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in the .env file}
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      # Do not send anonymous usage data to n8n.
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      # Workflows, credentials and the n8n user account live here.
      - n8n_data:/home/node/.n8n
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_data:
  n8n_data:
